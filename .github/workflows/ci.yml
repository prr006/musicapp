name: MELO CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Run Go tests
        shell: bash
        run: |
          set -o pipefail
          if ! go test ./... 2>&1 | tee /tmp/go-test.log; then
            message=$(tail -c 6000 /tmp/go-test.log)
            message=${message//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            message=${message//$'\r'/'%0D'}
            echo "::error title=Go test failure::$message"
            exit 1
          fi
      - run: go vet ./...
      - run: go build -trimpath -o /tmp/melo-api ./server
      - name: Build Wails desktop shell (Windows)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/MELO.exe .

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build production container
        run: docker build --tag melo-api:ci .
      - name: Start production container and verify health
        shell: bash
        run: |
          set -euo pipefail
          session_secret=$(openssl rand -hex 32)
          playback_secret=$(openssl rand -hex 32)
          data_dir=$(mktemp -d)
          mkdir -p "$data_dir/accounts"
          touch "$data_dir/accounts/.existing-root-owned-data"
          chmod 0700 "$data_dir/accounts"
          docker run --detach --rm --name melo-api-ci \
            --publish 18080:8080 \
            --mount "type=bind,src=$data_dir,dst=/data" \
            --env MELO_ENV=production \
            --env MELO_DATA_DIR=/data \
            --env ADDR=127.0.0.1:9999 \
            --env PORT=8080 \
            --env COOKIE_SECURE=true \
            --env TRUST_PROXY_HEADERS=true \
            --env CORS_ORIGINS=https://ci-frontend.invalid \
            --env SESSION_SECRET="$session_secret" \
            --env PLAYBACK_SIGNING_KEY="$playback_secret" \
            melo-api:ci
          report_container_failure() {
            status=$?
            if [ "$status" -ne 0 ]; then
              message=$(docker logs melo-api-ci 2>&1 | tail -c 5000 || true)
              message=${message//'%'/'%25'}
              message=${message//$'\n'/'%0A'}
              message=${message//$'\r'/'%0D'}
              echo "::error title=Production container smoke failure::$message"
            fi
            docker stop melo-api-ci >/dev/null 2>&1 || true
            exit "$status"
          }
          trap report_container_failure EXIT
          curl --fail --show-error --silent --retry 20 --retry-all-errors --retry-delay 1 \
            http://127.0.0.1:18080/health | grep -q '"status":"ok"'
          curl --fail --show-error --silent http://127.0.0.1:18080/ready | grep -q '"status":"ready"'
          headers=$(mktemp)
          curl --fail --show-error --silent --dump-header "$headers" --output /dev/null \
            --header 'Origin: https://ci-frontend.invalid' \
            http://127.0.0.1:18080/api/v1/state
          grep -qi '^Access-Control-Allow-Origin: https://ci-frontend.invalid' "$headers"
          grep -qi '^X-Request-Id:' "$headers"
          test -d "$data_dir/accounts"
          # /ready is executed by the gosu-dropped MELO process and now performs
          # an actual create/remove write probe. Its 200 is the authoritative
          # unprivileged-volume check; avoid a second docker-exec user model.

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
