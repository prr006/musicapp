name: MELO CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: true
      - name: Run Go tests
        shell: bash
        run: |
          set -o pipefail
          if ! go test ./... 2>&1 | tee /tmp/go-test.log; then
            message=$(tail -c 6000 /tmp/go-test.log)
            message=${message//'%'/'%25'}
            message=${message//$'\n'/'%0A'}
            message=${message//$'\r'/'%0D'}
            echo "::error title=Go test failure::$message"
            exit 1
          fi
      - run: go vet ./...
      - run: go build -trimpath -o /tmp/melo-api ./server
      - name: Build Wails desktop shell (Windows)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -o /tmp/MELO.exe .

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
